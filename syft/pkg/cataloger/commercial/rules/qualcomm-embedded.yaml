vendor: qualcomm

products:
  - id: qualcomm.modem.runtime
    canonical_vendor: qualcomm
    canonical_product: modem_runtime
    product_family: cellular-runtime
    component_kind: functional-stack
    aliases:
      - "Qualcomm modem runtime"

    path_markers:
      - glob: "*qmi*"
        confidence: 0.60
      - glob: "*qrtr*"
        confidence: 0.60
      - glob: "*rmnet*"
        confidence: 0.60
      - glob: "*mhi*"
        confidence: 0.60
      - glob: "*modem*"
        confidence: 0.60
      - glob: "*wwan*"
        confidence: 0.60

    text_markers:
      - file_glob: "**/*"    # <-- 여기를 꼭 **/* 로 변경!
        contains: "Qualcomm"
        confidence: 0.20
      - file_glob: "**/*"    # <-- 여기도!
        contains: "QMI"
        confidence: 0.20
      - file_glob: "**/*"    # <-- 여기도!
        contains: "modem"
        confidence: 0.20

    version_hints:
      - source: path
        file_glob: "*"
        regex: '(?i)[/_-]v?([0-9]+(?:\.[0-9]+){1,3})[/_-]'
        confidence: 0.55

    cpe_templates:
      - "cpe:2.3:a:qualcomm:modem_runtime:{version}:*:*:*:*:*:*:*"

    thresholds:
      # [핵심] 합격선을 0.10으로 대폭 낮춤 (텍스트 마커 하나만 걸려도 합격!)
      identify: 0.10
      select_cpe: 0.80

  - id: qualcomm.wifi.runtime
    canonical_vendor: qualcomm
    canonical_product: wifi_runtime
    product_family: wifi-runtime
    component_kind: functional-stack
    aliases:
      - "Qualcomm Wi-Fi runtime"

    path_markers:
      - glob: "*ath11k*"
        confidence: 0.60
      - glob: "*ath10k*"
        confidence: 0.60
      - glob: "*cnss*"
        confidence: 0.60
      - glob: "*wifi*"
        confidence: 0.60

    text_markers:
      - file_glob: "*"
        contains: "Qualcomm"
        confidence: 0.20
      - file_glob: "*"
        contains: "wifi"
        confidence: 0.20

    version_hints:
      - source: path
        file_glob: "*"
        regex: '(?i)[/_-]v?([0-9]+(?:\.[0-9]+){1,3})[/_-]'
        confidence: 0.55

    cpe_templates:
      - "cpe:2.3:a:qualcomm:wifi_runtime:{version}:*:*:*:*:*:*:*"

    thresholds:
      identify: 0.10
      select_cpe: 0.80