vendor: qualcomm

products:
  - id: qualcomm.modem.runtime
    canonical_vendor: qualcomm
    canonical_product: modem_runtime
    product_family: cellular-runtime
    component_kind: functional-stack
    aliases:
      - "Qualcomm modem runtime"
      - "Qualcomm cellular userspace stack"
      - "Qualcomm modem control stack"

    path_markers:
      - glob: "**/*qmi*"
        confidence: 0.18
      - glob: "**/*qrtr*"
        confidence: 0.22
      - glob: "**/*rmnet*"
        confidence: 0.20
      - glob: "**/*mhi*"
        confidence: 0.18
      - glob: "**/etc/init.d/*modem*"
        confidence: 0.28
      - glob: "**/etc/init.d/*wwan*"
        confidence: 0.26
      - glob: "**/lib/firmware/*modem*"
        confidence: 0.24

    text_markers:
      - file_glob: "**/*"
        contains: "Qualcomm"
        confidence: 0.15
      - file_glob: "**/*"
        contains: "QMI"
        confidence: 0.20
      - file_glob: "**/*"
        contains: "QRTR"
        confidence: 0.24
      - file_glob: "**/*"
        contains: "rmnet"
        confidence: 0.18
      - file_glob: "**/*"
        contains: "mhi"
        confidence: 0.16

    version_hints:
      - source: file_text
        file_glob: "**/*"
        regex: '(?i)(?:version|ver|release)[: =]+([0-9]+(?:\.[0-9]+){1,3})'
        confidence: 0.85
      - source: path
        file_glob: "**/*"
        regex: '(?i)[/_-]v?([0-9]+(?:\.[0-9]+){1,3})[/_-]'
        confidence: 0.55

    negative_matchers:
      - file_glob: "**/*"
        contains: "Qualcomm AI Engine Direct"
        confidence_penalty: 0.20
      - file_glob: "**/*"
        contains: "Hexagon SDK"
        confidence_penalty: 0.20

    cpe_templates:
      - "cpe:2.3:a:qualcomm:modem_runtime:{version}:*:*:*:*:*:*:*"

    thresholds:
      identify: 0.78
      select_cpe: 0.95

  - id: qualcomm.wifi.runtime
    canonical_vendor: qualcomm
    canonical_product: wifi_runtime
    product_family: wifi-runtime
    component_kind: functional-stack
    aliases:
      - "Qualcomm Wi-Fi runtime"
      - "Qualcomm wireless runtime"

    path_markers:
      - glob: "**/*ath11k*"
        confidence: 0.22
      - glob: "**/*ath10k*"
        confidence: 0.20
      - glob: "**/*cnss*"
        confidence: 0.20
      - glob: "**/lib/firmware/**/*wifi*"
        confidence: 0.16

    text_markers:
      - file_glob: "**/*"
        contains: "Qualcomm"
        confidence: 0.15
      - file_glob: "**/*"
        contains: "ath11k"
        confidence: 0.20
      - file_glob: "**/*"
        contains: "ath10k"
        confidence: 0.20
      - file_glob: "**/*"
        contains: "cnss"
        confidence: 0.22

    version_hints:
      - source: file_text
        file_glob: "**/*"
        regex: '(?i)(?:version|ver|release)[: =]+([0-9]+(?:\.[0-9]+){1,3})'
        confidence: 0.80

    negative_matchers:
      - file_glob: "**/*"
        contains: "Hexagon SDK"
        confidence_penalty: 0.20

    cpe_templates:
      - "cpe:2.3:a:qualcomm:wifi_runtime:{version}:*:*:*:*:*:*:*"

    thresholds:
      identify: 0.74
      select_cpe: 0.95